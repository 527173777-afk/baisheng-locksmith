<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>百盛锁业 - 信息登记</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef1f6;
  color: #1f2937;
  min-height: 100vh;
  padding-bottom: 40px;
}
.header {
  background: linear-gradient(135deg, #123c7a, #1e5db3);
  color: #fff;
  padding: 24px 20px 20px;
  text-align: center;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }
.form-card {
  background: #fff;
  border-radius: 14px;
  margin: 16px 14px;
  padding: 18px 16px;
  box-shadow: 0 1px 4px rgba(31,41,55,0.06);
}
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 6px;
}
.field label .req { color: #e11d48; }
.field input, .field textarea {
  width: 100%;
  border: 1.5px solid #d8dee9;
  border-radius: 10px;
  padding: 12px;
  background: #fafbfd;
  font-size: 15px;
  color: #1f2937;
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}
.field input:focus, .field textarea:focus {
  border-color: #1e5db3;
  background: #fff;
}
.field textarea { resize: none; line-height: 1.5; }
.btn-submit {
  width: calc(100% - 28px);
  margin: 8px 14px 0;
  padding: 15px 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #f59e0b, #ea7a0c);
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 3px;
  border: none;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(234,122,12,0.35);
}
.btn-submit:active { opacity: 0.88; transform: scale(0.99); }
.qr-section {
  display: none;
  text-align: center;
  padding: 20px 14px;
}
.qr-section.show { display: block; }
.qr-box {
  background: #fff;
  border-radius: 16px;
  padding: 24px 20px;
  margin: 0 auto;
  max-width: 340px;
  box-shadow: 0 2px 12px rgba(31,41,55,0.1);
}
.qr-box h2 {
  font-size: 18px;
  color: #123c7a;
  margin-bottom: 6px;
}
.qr-box .tip {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: 16px;
}
#qrcode {
  display: inline-block;
  padding: 12px;
  background: #fff;
  border: 2px solid #123c7a;
  border-radius: 10px;
}
#qrcode img, #qrcode canvas { display: block; }
.info-summary {
  text-align: left;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed #e5e9f0;
}
.info-summary .row {
  display: flex;
  font-size: 13px;
  padding: 4px 0;
}
.info-summary .row .k {
  color: #9aa3b2;
  width: 70px;
  flex-shrink: 0;
}
.info-summary .row .v {
  color: #1f2937;
  word-break: break-all;
  flex: 1;
}
.btn-back {
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 10px;
  background: #fff;
  color: #1e5db3;
  border: 1.5px solid #1e5db3;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-back:active { opacity: 0.8; }
.notice {
  text-align: center;
  font-size: 12px;
  color: #9aa3b2;
  margin-top: 12px;
  padding: 0 20px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="header">
  <h1>百盛锁业</h1>
  <p>请填写您的信息，提交后生成二维码给师傅扫描</p>
</div>

<div id="formArea">
  <div class="form-card">
    <div class="field">
      <label>姓名 <span class="req">*</span></label>
      <input type="text" id="fName" placeholder="请输入您的姓名" maxlength="20">
    </div>
    <div class="field">
      <label>身份证号</label>
      <input type="text" id="fIdCard" placeholder="请输入身份证号（选填）" maxlength="18" autocomplete="off">
    </div>
    <div class="field">
      <label>车牌号码</label>
      <input type="text" id="fPlate" placeholder="如：鲁B·12345（选填）" maxlength="10" autocomplete="off">
    </div>
    <div class="field">
      <label>服务地址 <span class="req">*</span></label>
      <textarea id="fAddress" rows="2" placeholder="请输入详细地址（小区、楼栋、单元、门牌号）"></textarea>
    </div>
  </div>
  <button class="btn-submit" onclick="generateQR()">生成二维码</button>
  <div class="notice">信息仅用于本次服务登记，师傅扫码后自动录入，不会保存到第三方服务器</div>
</div>

<div class="qr-section" id="qrArea">
  <div class="qr-box">
    <h2>信息已生成</h2>
    <p class="tip">请将下方二维码出示给师傅扫描</p>
    <div id="qrcode"></div>
    <div class="info-summary" id="infoSummary"></div>
  </div>
  <button class="btn-back" onclick="backToForm()">返回修改</button>
</div>

<script>
function generateQR() {
  var name = document.getElementById('fName').value.trim();
  var idCard = document.getElementById('fIdCard').value.trim().toUpperCase();
  var plate = document.getElementById('fPlate').value.trim().toUpperCase();
  var address = document.getElementById('fAddress').value.trim();

  if (!name) { alert('请填写姓名'); return; }
  if (!address) { alert('请填写服务地址'); return; }
  if (idCard && !/^(\d{15}|\d{17}[\dXx])$/.test(idCard)) {
    alert('身份证号格式不正确');
    return;
  }

  var data = {
    name: name,
    idCard: idCard,
    plate: plate,
    address: address,
    t: Date.now()
  };
  var jsonStr = JSON.stringify(data);

  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: jsonStr,
    width: 220,
    height: 220,
    colorDark: '#123c7a',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  var summary = document.getElementById('infoSummary');
  summary.innerHTML =
    '<div class="row"><span class="k">姓名</span><span class="v">' + esc(name) + '</span></div>' +
    '<div class="row"><span class="k">身份证</span><span class="v">' + esc(idCard || '未填写') + '</span></div>' +
    '<div class="row"><span class="k">车牌号</span><span class="v">' + esc(plate || '未填写') + '</span></div>' +
    '<div class="row"><span class="k">地址</span><span class="v">' + esc(address) + '</span></div>';

  document.getElementById('formArea').style.display = 'none';
  document.getElementById('qrArea').classList.add('show');
  window.scrollTo(0, 0);
}

function backToForm() {
  document.getElementById('formArea').style.display = 'block';
  document.getElementById('qrArea').classList.remove('show');
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
